<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giydirmece</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg:#fff1f8;--panel:#ffffff;--ink:#4a1d4a;--soft:#8a5a8a;--accent:#ff4fa3;--accent-ink:#fff;--line:#f3c9e0;--chip:#fff7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1030;--panel:#2a1845;--ink:#fde8f4;--soft:#c9a6d6;--accent:#ff6cb4;--accent-ink:#2a0f2a;--line:#4b2d6e;--chip:#331f55}}
:root[data-theme="dark"]{--bg:#1d1030;--panel:#2a1845;--ink:#fde8f4;--soft:#c9a6d6;--accent:#ff6cb4;--accent-ink:#2a0f2a;--line:#4b2d6e;--chip:#331f55}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;min-height:100%}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}
h1{grid-column:1/-1;margin:4px 0 0;font-size:2rem;font-weight:600;letter-spacing:.01em}
h1 small{display:block;font-size:1rem;font-weight:400;color:var(--soft)}
.stage{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:8px;position:sticky;top:8px}
.stage svg{display:block;width:100%;max-height:76vh;border-radius:22px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{border:2px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 14px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;border:2px solid var(--line);background:var(--chip);border-radius:16px;padding:9px 10px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;font-weight:600}
.dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.12)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 18px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (max-width:720px){main{grid-template-columns:1fr}.stage{position:static}.stage svg{max-height:62vh}}
@media (prefers-reduced-motion:no-preference){.chip,.tab,.btn{transition:transform .12s}.chip:active,.btn:active{transform:scale(.96)}}
</style>
</head>
<body>
<main>
<h1>Giydirmece<small>Bebeğini giydir, saçını seç, tarzını yarat.</small></h1>
<div class="stage"><svg id="doll" viewBox="0 0 300 520" role="img" aria-label="Giydirilen bebek"></svg></div>
<div class="panel">
<div class="tabs" id="tabs" role="tablist"></div>
<div class="chips" id="chips"></div>
<div class="actions">
<button class="btn" id="rnd">Rastgele giydir</button>
<button class="btn alt" id="rst">Baştan başla</button>
</div>
</div>
</main>
<script>
var DRESSES=[
{n:"Pembe elbise",bc:"#ff5fa8",sc:"#ff5fa8",belt:"#fff",h:385,fl:42},
{n:"Mor parti elbisesi",bc:"#8b5cf6",sc:"#8b5cf6",belt:"#ffd34d",h:318,fl:40},
{n:"Mavi gece elbisesi",bc:"#2f6fed",sc:"#2f6fed",belt:"#c9dcff",h:466,fl:38},
{n:"Kot ve tişört",bc:"#ffffff",sc:"#4f8fd8",belt:"#2c5f9e",t:"p",heart:1},
{n:"Sarı etek",bc:"#ffffff",sc:"#f7c52e",belt:"#e08a00",h:345,fl:30,heart:1},
{n:"Yeşil elbise",bc:"#25b58a",sc:"#25b58a",belt:"#0f7c5c",h:362,fl:12}
];
var HAIRS=["Uzun","Küt","At kuyruğu","Topuz"];
var HCOL=[["Sarı","#f2c75c"],["Kahve","#6b3f2a"],["Pembe","#ff7ab8"],["Siyah","#2a1f2d"],["Kızıl","#c8442b"]];
var SHOES=["Spor ayakkabı","Topuklu","Bot","Babet"];
var SHC=["#ffffff","#e0245e","#6b3f2a","#f7a8c8"];
var ACCS=["Taç","Fiyonk","Güneş gözlüğü","Kolye","Küpe"];
var BGS=[
{n:"Pembe gün",g:["#ffd3ea","#fff0f8"]},
{n:"Nane bahçesi",g:["#bff2dd","#f2fcea"],ground:"#8fdcb0"},
{n:"Yıldızlı gece",g:["#2b1a5e","#7a46b8"],stars:1},
{n:"Podyum",g:["#1d1230","#4a2268"],spot:1}
];
var TABS=[["dress","Kıyafet"],["hair","Saç"],["hc","Saç rengi"],["shoe","Ayakkabı"],["acc","Aksesuar"],["bg","Fon"]];
var st,tab="dress";
function reset(){st={dress:0,hair:0,hc:0,shoe:0,acc:[],bg:0}}
reset();
var SKIN="#f6d2b8";
function hairBack(c){
 var h=st.hair;
 if(h===0)return '<path d="M104 95 Q104 38 150 38 Q196 38 196 95 L202 236 Q150 248 98 236Z" fill="'+c+'"/>';
 if(h===1)return '<path d="M106 95 Q106 42 150 42 Q194 42 194 95 L196 146 Q150 158 104 146Z" fill="'+c+'"/>';
 if(h===2)return '<path d="M184 62 Q250 64 236 180 Q222 124 190 104Z" fill="'+c+'"/>';
 return '<circle cx="116" cy="50" r="19" fill="'+c+'"/><circle cx="184" cy="50" r="19" fill="'+c+'"/>';
}
function hairFront(c){
 return '<path d="M111 96 Q111 46 150 46 Q189 46 189 96 Q172 72 150 64 Q128 72 111 96Z" fill="'+c+'"/>';
}
function dress(d){
 var s='<path d="M122 150 Q150 160 178 150 L173 217 L127 217Z" fill="'+d.bc+'"/>';
 if(d.t==="p")s+='<path d="M127 215 L173 215 L172 472 L152 472 L150 305 L148 472 L128 472Z" fill="'+d.sc+'"/>';
 else s+='<path d="M127 215 L173 215 L'+(173+d.fl)+' '+d.h+' Q150 '+(d.h+16)+' '+(127-d.fl)+' '+d.h+'Z" fill="'+d.sc+'"/>';
 s+='<rect x="127" y="211" width="46" height="7" rx="3" fill="'+d.belt+'"/>';
 if(d.heart)s+='<path d="M150 202 C130 188 136 174 146 178 C148 179 150 182 150 182 C150 182 152 179 154 178 C164 174 170 188 150 202Z" fill="'+(d.t?"#ff5fa8":"#ff5fa8")+'"/>';
 return s;
}
function shoe(x,t){
 var c=SHC[t];
 if(t===0)return '<path d="M'+(x-10)+' 468 h20 v14 q0 8 -8 8 h-14 q-4 0 -4 -6 q0 -8 6 -8z" fill="#fff" stroke="#ff4fa3" stroke-width="2.5"/><rect x="'+(x-14)+'" y="488" width="26" height="5" rx="2.5" fill="#ff4fa3"/>';
 if(t===1)return '<path d="M'+(x-8)+' 468 h16 l5 18 h-26z" fill="'+c+'"/><rect x="'+(x+4)+'" y="484" width="3.5" height="12" fill="'+c+'"/>';
 if(t===2)return '<rect x="'+(x-10)+'" y="418" width="20" height="74" rx="7" fill="'+c+'"/>';
 return '<path d="M'+(x-10)+' 480 q10 -16 20 0 v10 h-20z" fill="'+c+'"/>';
}
function build(){
 var b=BGS[st.bg],d=DRESSES[st.dress],hc=HCOL[st.hc][1],A=st.acc;
 var s='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+b.g[0]+'"/><stop offset="1" stop-color="'+b.g[1]+'"/></linearGradient></defs>';
 s+='<rect width="300" height="520" fill="url(#g)"/>';
 if(b.stars)[[40,50],[240,40],[70,150],[260,130],[30,260],[270,250],[220,90]].forEach(function(p){s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.5" fill="#fff6c8"/>'});
 if(b.ground)s+='<rect y="494" width="300" height="26" fill="'+b.ground+'"/>';
 if(b.spot)s+='<path d="M110 0 L190 0 L290 520 L10 520Z" fill="#fff" opacity=".12"/><rect y="494" width="300" height="26" fill="#2a1445"/>';
 s+='<ellipse cx="150" cy="497" rx="62" ry="7" fill="#000" opacity=".15"/>';
 s+=hairBack(hc);
 s+='<path d="M120 158 L96 292" stroke="'+SKIN+'" stroke-width="13" stroke-linecap="round"/><path d="M180 158 L204 292" stroke="'+SKIN+'" stroke-width="13" stroke-linecap="round"/>';
 s+='<path d="M136 300 V472" stroke="'+SKIN+'" stroke-width="15" stroke-linecap="round"/><path d="M164 300 V472" stroke="'+SKIN+'" stroke-width="15" stroke-linecap="round"/>';
 s+=dress(d);
 s+=shoe(136,st.shoe)+shoe(164,st.shoe);
 s+='<rect x="142" y="128" width="16" height="26" rx="6" fill="'+SKIN+'"/>';
 s+='<ellipse cx="150" cy="94" rx="38" ry="44" fill="'+SKIN+'"/>';
 s+='<circle cx="131" cy="108" r="6" fill="#ff8fb8" opacity=".45"/><circle cx="169" cy="108" r="6" fill="#ff8fb8" opacity=".45"/>';
 s+='<circle cx="137" cy="94" r="4.2" fill="#3b2340"/><circle cx="163" cy="94" r="4.2" fill="#3b2340"/><circle cx="138.5" cy="92.5" r="1.4" fill="#fff"/><circle cx="164.5" cy="92.5" r="1.4" fill="#fff"/>';
 s+='<path d="M131 88 l-5 -3 M169 88 l5 -3" stroke="#3b2340" stroke-width="2" stroke-linecap="round"/>';
 s+='<path d="M141 113 Q150 121 159 113" stroke="#d2395f" stroke-width="3" fill="none" stroke-linecap="round"/>';
 s+=hairFront(hc);
 if(A.indexOf(0)>-1)s+='<path d="M120 58 L124 32 L137 45 L150 26 L163 45 L176 32 L180 58Z" fill="#ffc933" stroke="#e0a000" stroke-width="2" stroke-linejoin="round"/>';
 if(A.indexOf(1)>-1)s+='<path d="M180 62 L160 50 L160 74Z M180 62 L200 50 L200 74Z" fill="#ff4fa3"/><circle cx="180" cy="62" r="5" fill="#d92d85"/>';
 if(A.indexOf(2)>-1)s+='<rect x="124" y="86" width="23" height="15" rx="6" fill="#22152b" opacity=".9"/><rect x="153" y="86" width="23" height="15" rx="6" fill="#22152b" opacity=".9"/><path d="M147 92 h6" stroke="#22152b" stroke-width="2.5"/>';
 if(A.indexOf(3)>-1)s+='<path d="M137 154 Q150 176 163 154" stroke="#ffc933" stroke-width="5" fill="none" stroke-dasharray="0.1 7" stroke-linecap="round"/>';
 if(A.indexOf(4)>-1)s+='<circle cx="112" cy="112" r="4.5" fill="#ffc933"/><circle cx="188" cy="112" r="4.5" fill="#ffc933"/>';
 return s;
}
function render(){
 document.getElementById("doll").innerHTML=build();
 var tabs=document.getElementById("tabs");tabs.innerHTML="";
 TABS.forEach(function(t){
  var b=document.createElement("button");b.className="tab";b.textContent=t[1];b.setAttribute("role","tab");
  b.setAttribute("aria-selected",t[0]===tab);b.onclick=function(){tab=t[0];render()};tabs.appendChild(b);
 });
 var items=[];
 if(tab==="dress")items=DRESSES.map(function(d,i){return [d.n,d.sc==="#ffffff"?d.bc:d.sc,st.dress===i,i]});
 if(tab==="hair")items=HAIRS.map(function(n,i){return [n,HCOL[st.hc][1],st.hair===i,i]});
 if(tab==="hc")items=HCOL.map(function(c,i){return [c[0],c[1],st.hc===i,i]});
 if(tab==="shoe")items=SHOES.map(function(n,i){return [n,SHC[i],st.shoe===i,i]});
 if(tab==="acc")items=ACCS.map(function(n,i){return [n,"#ffc933",st.acc.indexOf(i)>-1,i]});
 if(tab==="bg")items=BGS.map(function(g,i){return [g.n,"linear-gradient("+g.g[0]+","+g.g[1]+")",st.bg===i,i]});
 var box=document.getElementById("chips");box.innerHTML="";
 items.forEach(function(it){
  var b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",it[2]);
  b.innerHTML='<span class="dot" style="background:'+it[1]+'"></span><span>'+it[0]+'</span>';
  b.onclick=function(){pick(it[3])};box.appendChild(b);
 });
}
function pick(i){
 if(tab==="acc"){var k=st.acc.indexOf(i);if(k>-1)st.acc.splice(k,1);else st.acc.push(i)}
 else st[tab]=i;
 render();
}
function r(n){return Math.floor(Math.random()*n)}
document.getElementById("rnd").onclick=function(){
 st={dress:r(DRESSES.length),hair:r(4),hc:r(HCOL.length),shoe:r(4),acc:[],bg:r(BGS.length)};
 for(var i=0;i<ACCS.length;i++)if(Math.random()<.4)st.acc.push(i);
 render();
};
document.getElementById("rst").onclick=function(){reset();render()};
render();
</script>
</body>
</html>
